name: Quality Gates

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install quality tooling
        run: |
          npm install --no-save --no-package-lock --ignore-scripts \
            eslint@10.15.0 \
            @eslint/js@10.0.1 \
            globals@17.14.0 \
            typescript-eslint@8.74.0 \
            eslint-plugin-astro@3.2.2 \
            eslint-plugin-mdx@3.8.1 \
            stylelint@18.1.0 \
            stylelint-config-recommended@19.1.0

      - name: Check Astro and TypeScript
        run: npx --no-install astro check

      - name: Lint Astro, TypeScript, JavaScript, and MDX
        run: npx --no-install eslint .

      - name: Lint CSS
        run: npx --no-install stylelint "src/**/*.css"

      - name: Build production site
        run: npm run build
